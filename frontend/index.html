<!-- index.html (Arquivo Principal) -->
<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css" rel="stylesheet" integrity="sha384-sRIl4kxILFvY47J16cr9ZwB07vP4J8+LH7qKQnuqkuIAvNWLzeN8tE5YBujZqJLB" crossorigin="anonymous">
    <link rel="stylesheet" href="style.css">
    <title>Interface VS Code com Activity Bar e Carregamento Dinâmico via Iframe</title>
    <style>
        /* Reset e Estilos Base */
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background-color: #1e1e1e;
            color: #d4d4d4;
            height: 100vh;
            display: flex;
            flex-direction: column;
        }

        /* Barra Superior (Menu Simples) */
        .top-bar {
            height: 30px;
            background-color: #3c3c3c;
            display: flex;
            align-items: center;
            padding: 0 10px;
            border-bottom: 1px solid #616161;
        }

        .top-bar .logo {
            font-size: 14px;
            font-weight: bold;
            color: #ffffff;
            margin-right: auto;
        }

        .top-bar .icons {
            display: flex;
            gap: 5px;
        }

        .top-bar .icon {
            width: 16px;
            height: 16px;
            background-color: #ffffff;
            border-radius: 2px;
            opacity: 0.7;
        }

        /* Container Principal */
        .main-container {
            flex: 1;
            display: flex;
        }

        /* Activity Bar (Barra de Atividades à Esquerda) */
        .activity-bar {
            width: 50px;
            background-color: #212121;
            border-right: 1px solid #616161;
            display: flex;
            flex-direction: column;
            align-items: center;
            padding: 10px 0;
            gap: 20px;
        }

        .activity-item {
            width: 32px;
            height: 32px;
            background-color: #ffffff;
            border-radius: 4px;
            display: flex;
            align-items: center;
            justify-content: center;
            cursor: pointer;
            color: #808080;
            font-size: 16px;
            transition: background-color 0.2s, color 0.2s;
            border: 2px solid transparent;
        }

        .activity-item:hover {
            background-color: #3c3c3c;
            color: #ffffff;
        }

        .activity-item.active {
            background-color: #007acc;
            color: #ffffff;
            border-color: #007acc;
        }

        /* Área de Conteúdo Principal (Iframe para Carregamento Dinâmico) */
        .content-area {
            flex: 1;
            background-color: #1e1e1e;
            position: relative;
            overflow: hidden;
        }

        .content-iframe {
            width: 100%;
            height: 100%;
            border: none;
            background-color: #1e1e1e;
        }

        .loading {
            position: absolute;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            text-align: center;
            color: #808080;
            font-style: italic;
            z-index: 10;
        }
    </style>
</head>
<body>
    

    <!-- Container Principal -->
    <div class="main-container">
        <!-- Activity Bar com 4 Itens -->
        <div class="activity-bar">
            <div class="activity-item active" data-view="home">🏠</div> <!-- Home -->
            <div class="activity-item" data-view="dashboard">📊</div> <!-- Dashboard -->
            <div class="activity-item" data-view="settings">⚙️</div> <!-- Configurações -->
            <div class="activity-item" data-view="profile">👤</div> <!-- Perfil -->
        </div>

        <!-- Área de Conteúdo (Container para Loading Dinâmico) -->
        <div class="content-area">
            <div class="loading" id="loading">Loading...</div>
            <div id="content-area" class="p-4"></div>  <!-- Container para views -->
        </div>
    </div>

    <script>
    // Mapeamento de itens da Activity Bar para arquivos HTML
    const viewMap = {
      home: 'views/home.html',
      dashboard: 'views/dashboard.html',
      settings: 'views/settings.html',
      profile: 'views/profile.html'
    };

    // Função para carregar view via fetch (sem iframe)
    function loadView(viewName) {
      const contentArea = document.getElementById('content-area');
      const loading = document.getElementById('loading');
      const filePath = viewMap[viewName] || viewMap['home'];  // Fallback para home

      loading.style.display = 'block';
      contentArea.innerHTML = '';  // Limpa conteúdo anterior

      fetch(filePath)
        .then(response => response.text())
        .then(html => {
          contentArea.innerHTML = html;
          loading.style.display = 'none';
          
          // Atualiza active na Activity Bar
          document.querySelectorAll('.activity-item').forEach(item => item.classList.remove('active'));
          document.querySelector(`[data-view="${viewName}"]`).classList.add('active');

          // Opcional: Execute script no novo conteúdo (se views tiverem <script>)
          const scripts = contentArea.querySelectorAll('script');
          scripts.forEach(script => {
            const newScript = document.createElement('script');
            newScript.textContent = script.textContent;
            script.parentNode.replaceChild(newScript, script);
          });
        })
        .catch(error => {
          console.error('Failed to load view:', error);
          contentArea.innerHTML = '<p>Error loading view. Check console.</p>';
          loading.style.display = 'none';
        });
    }

    // Event listener para Activity Bar
    document.querySelectorAll('.activity-item').forEach(item => {
      item.addEventListener('click', () => {
        const viewName = item.dataset.view;
        loadView(viewName);
      });
    });

    // Carrega a view inicial (home) ao abrir
    loadView('home');
  </script>
</body>
</html>
