<!-- views/settings.html -->
<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <style>
        body { 
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background-color: #1e1e1e; 
            color: #d4d4d4; 
            padding: 20px; 
            margin: 0; 
            height: 100vh; 
            overflow: auto;
        }
        h1 { color: #ffffff; margin-bottom: 20px; font-size: 24px; }
        h2 { color: #ffffff; margin: 20px 0 10px 0; font-size: 18px; }
        p, li { line-height: 1.5; margin-bottom: 10px; color: #d4d4d4; }
        ul { list-style-type: disc; padding-left: 20px; }
        .card { background-color: #252526; padding: 15px; border-radius: 4px; margin: 10px 0; border-left: 4px solid #007acc; }
        form { background-color: #252526; padding: 15px; border-radius: 4px; margin-top: 10px; }
        input, select, button { width: 100%; padding: 8px; margin: 5px 0; background-color: #3c3c3c; color: #d4d4d4; border: 1px solid #616161; border-radius: 4px; }
        button { background-color: #007acc; color: #ffffff; cursor: pointer; border: none; }
        button:hover { background-color: #005a9e; }
    </style>
</head>
<body>
    <h1>Configurações</h1>
    <div class="card">
        <h2>Preferências Gerais</h2>
        <form id="settings-form">
            <label>Tema:</label>
            <select id="theme-select">
                <option>Escuro</option>
                <option>Claro</option>
            </select>
            <label>Notificações:</label>
            <input type="checkbox" id="notifications" checked>
            <button type="submit">Salvar</button>
        </form>
    </div>
    <div class="card">
        <h2>Opções Avançadas</h2>
        <p>Idioma: Português</p>
        <p>Auto-save: Ativado</p>
        <button id="reset-btn">Resetar Configurações</button>
    </div>
    <p>Use Electron's `ipcRenderer` para enviar dados ao main process e processar no backend Node.js.</p>
    <script>
        document.getElementById('settings-form').addEventListener('submit', (e) => {
            e.preventDefault();
            alert('Configurações salvas! (Simulado)');
        });
        document.getElementById('reset-btn').addEventListener('click', () => {
            if (confirm('Resetar?')) {
                alert('Resetado! (Simulado)');
            }
        });
    </script>
</body>
</html>
